# Push-time verification — mirrors the local .githooks/pre-commit gate, plus the full vite build.
# Also runs on pull_request, so Dependabot's dependency-bump PRs are verified before you merge them.
name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

# Cancel an in-progress run when a newer commit lands on the same ref (saves CI minutes).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build   # typecheck + vite build
